apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  releaseName: tailscale-operator
  chart:
    spec:
      chart: tailscale-operator
      version: ">= 1.70.0"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 1h
  interval: 1h
  values:
    # Instructs the operator to route traffic to your home subnet
    router:
      enable: true
      routes:
        - 192.168.0.0/24
    # Points to the secret containing your authentication key
    oauth:
      secretName: tailscale-auth