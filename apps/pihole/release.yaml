apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: networking
spec:
  releaseName: pihole
  chart:
    spec:
      chart: pihole
      version: ">= 2.14.0"
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: networking
      interval: 1h
  interval: 1h
  values:
    privileged: "false"
    capabilities:
      drop:
        - ALL

    persistentVolumeClaim:
      enabled: true
      size: 5Gi
      storageClass: "local-path"

    serviceDns:
      type: LoadBalancer

    admin:
      enabled: true
  valuesFrom:
    - kind: Secret
      name: pihole-secret
      valuesKey: adminPassword
      targetPath: adminPassword