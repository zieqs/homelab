apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: networking
spec:
  releaseName: pihole
  chart:
    spec:
      chart: pihole
      version: ">= 2.14.0"
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: networking
      interval: 1h
  interval: 1h
  values:
    # ----------------------------------------------------
    # Storage Configuration
    # ----------------------------------------------------
    persistentVolumeClaim:
      enabled: true            # Flip this from false to true
      size: 5Gi                # 5 Gigabytes is plenty for gravity lists and logs
      storageClass: "local-path" # Uses k3s's built-in storage engine
      
    serviceDns:
      type: ClusterIP

    # ----------------------------------------------------
    # Admin Web Interface Configuration
    # ----------------------------------------------------
    adminPassword: "homelab" # Change this to a secure