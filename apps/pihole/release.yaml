apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: networking # Change this to your preferred namespace
spec:
  releaseName: pihole
  chart:
    spec:
      chart: pihole
      version: ">= 2.14.0" # Keeps the chart updated within major versions
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
      interval: 1h
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # ----------------------------------------------------
    # Persistent Storage Configuration
    # ----------------------------------------------------
    persistentVolumeClaim:
      enabled: true
      storageClass: "local-path" # default k3s storage class
      size: 5Gi

    # ----------------------------------------------------
    # Network / LoadBalancer Configuration
    # ----------------------------------------------------
    serviceDns:
      type: LoadBalancer
      annotations:
        # Replace with your MetalLB IP address pool annotation if needed
        metallb.universe.tf/loadBalancerIPs: "192.168.0.150" 
      loadBalancerIP: "192.168.0.150" # Deprecated but kept for older MetalLB versions
      externalTrafficPolicy: Local

    serviceWeb:
      type: ClusterIP # Use an Ingress controller (like Traefik) to access the UI

    # ----------------------------------------------------
    # Pi-hole Specific Configurations
    # ----------------------------------------------------
    DNS1: "1.1.1.1" # Upstream DNS provider (Cloudflare)
    DNS2: "8.8.8.8" # Upstream DNS provider (Google)
    
    # It's recommended to handle the admin password via a Kubernetes Secret,
    # but for an initial test you can set a plain value (not recommended for prod)
    adminPassword: "homelab" 

    # ----------------------------------------------------
    # Anti-collision settings for k3s
    # ----------------------------------------------------
    # k3s occasionally runs CoreDNS bound to node ports depending on setups.
    # Ensure standard DNS ports (53) are routed correctly through your LoadBalancer.