# 🖥️ GLANCES MASTER NODE WORKLOAD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glances-master
  namespace: kube-system
  labels:
    app: glances-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glances-master
  template:
    metadata:
      labels:
        app: glances-master
    spec:
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: homelab  # <-- Pins to Master Node
      containers:
        - name: glances
          image: nicolargo/glances:latest-full
          env:
            - name: GLANCES_OPT
              value: "-w"
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          ports:
            - name: web
              containerPort: 61208
              protocol: TCP
          securityContext:
            privileged: true
          volumeMounts:
            - name: var-run-docker
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: var-run-docker
          hostPath:
            path: /var/run/docker.sock
        - name: host-root
          hostPath:
            path: /
---
# 🖥️ GLANCES WORKER NODE WORKLOAD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glances-worker
  namespace: kube-system
  labels:
    app: glances-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glances-worker
  template:
    metadata:
      labels:
        app: glances-worker
    spec:
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: homelab-worker1  # <-- Pins to Worker Node
      containers:
        - name: glances
          image: nicolargo/glances:latest-full
          env:
            - name: GLANCES_OPT
              value: "-w"
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          ports:
            - name: web
              containerPort: 61208
              protocol: TCP
          securityContext:
            privileged: true
          volumeMounts:
            - name: var-run-docker
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: var-run-docker
          hostPath:
            path: /var/run/docker.sock
        - name: host-root
          hostPath:
            path: /
---
# 🎯 Service targeting ONLY the Master Node
apiVersion: v1
kind: Service
metadata:
  name: glances-master-svc
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 61208
      targetPort: 61208
  selector:
    app: glances-master # <-- Targets ONLY the master deployment
---
# 🎯 Service targeting ONLY the Worker Node
apiVersion: v1
kind: Service
metadata:
  name: glances-worker-svc
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 61208
      targetPort: 61208
  selector:
    app: glances-worker # <-- Targets ONLY the worker deployment