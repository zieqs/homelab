apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
  namespace: games
spec:
  replicas: 1 # FIXED: Scaled up to 1 replica
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # Optional: Remove nodeSelector unless you strictly need to lock it to this node
      nodeSelector:
        kubernetes.io/hostname: homelab-worker1
      containers:
        # Container 1: Forge Server + Create Mod
        - name: minecraft
          image: itzg/minecraft-server:java17
          tty: true
          stdin: true
          ports:
            - containerPort: 25565
              name: mc-port
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "FORGE"
            - name: VERSION
              value: "1.20.1"
            - name: FORGE_VERSION
              value: "47.3.0"
            
            # FIXED: Correct variable for single CurseForge mods
            # You can pass the slug ('create'), project ID, or URL
            - name: CURSEFORGE_FILES
              value: "create"

            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cf-api-key
                  key: CF_API_KEY
            
            # Java Memory Optimization
            - name: MEMORY
              value: "6G"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ENABLE_COMMAND_BLOCK
              value: "true"
            - name: ONLINE_MODE
              value: "false"
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          resources:
            requests:
              memory: "6Gi"
              cpu: "1500m"
            limits:
              memory: "8Gi"
              cpu: "4000m" # Added CPU limit so Forge doesn't starve the host
          volumeMounts:
            - name: mc-data
              mountPath: /data

        # Container 2: Playit.gg Tunnel Sidecar
        - name: playit-agent
          image: ghcr.io/playit-cloud/playit-agent:0.17
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-secret
                  key: SECRET_KEY
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m" # FIXED: Increased CPU ceiling to prevent start-up timeout crashes

      volumes:
        - name: mc-data
          hostPath:
            path: /mnt/sata-storage/minecraft-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-svc
  namespace: games
spec:
  type: ClusterIP
  ports:
    - port: 25565
      targetPort: 25565
      name: mc-port
  selector:
    app: minecraft