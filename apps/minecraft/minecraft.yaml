apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
  namespace: games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-worker1
      containers:
        # Container 1: The Seaopolis Submerged Modded Server
        - name: minecraft
          image: itzg/minecraft-server:java17
          ports:
            - containerPort: 25565
              name: mc-port
          env:
            - name: EULA
              value: "TRUE"
            # 1. CHANGED: Switched TYPE to CURSEFORGE
            - name: TYPE
              value: "CURSEFORGE"
            # 2. ADDED: Direct URL to official Seaopolis Submerged server zip (Bypasses API Key)
            - name: CF_SERVER_MOD
              value: "https://edge.forgecdn.net/files/5370/362/Seaopolis_Submerged_Server_Pack_1.0.zip"
            # 3. REMOVED: CF_PAGE_URL and CF_API_KEY secret references
            - name: MEMORY
              value: "8G"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ENABLE_COMMAND_BLOCK
              value: "true"
            - name: ONLINE_MODE
              value: "false"
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          resources:
            requests:
              memory: "8Gi"
              cpu: "2.0"
            limits:
              memory: "10Gi"
          volumeMounts:
            - name: mc-data
              mountPath: /data

        # Container 2: Playit.gg Tunnel Sidecar
        - name: playit-agent
          image: ghcr.io/playit-cloud/playit-agent:0.17
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-secret
                  key: SECRET_KEY
          resources:
            limits:
              memory: "128Mi"
              cpu: "0.2"

      volumes:
        - name: mc-data
          hostPath:
            path: /mnt/sata-storage/minecraft-data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-svc
  namespace: games
spec:
  type: ClusterIP
  ports:
    - port: 25565
      targetPort: 25565
      name: mc-port
  selector:
    app: minecraft