apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
  namespace: games
spec:
  replicas: 0
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-worker1
      containers:
        # Container 1: Forge Server + Create Mod
        - name: minecraft
          image: itzg/minecraft-server:latest
          ports:
            - containerPort: 25565
              name: mc-port
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "FORGE"
            - name: VERSION
              value: "1.20.1"
            - name: FORGE_VERSION
              value: "47.3.0"
            - name: MODS
              value: "https://www.curseforge.com/minecraft/mc-mods/create"
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cf-api-key
                  key: CF_API_KEY
            - name: MEMORY
              value: "6G"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ENABLE_COMMAND_BLOCK
              value: "true"
            - name: ONLINE_MODE
              value: "false"
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          resources:
            requests:
              memory: "6Gi"
              cpu: "2.0"
            limits:
              memory: "8Gi"
          volumeMounts:
            - name: mc-data
              mountPath: /data

        # Container 2: Playit.gg Tunnel Sidecar
        - name: playit-agent
          image: ghcr.io/playit-cloud/playit-agent:0.17
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-secret
                  key: SECRET_KEY
          resources:
            requests:
              memory: "32Mi"
              cpu: "0.05"
            limits:
              memory: "128Mi"
              cpu: "0.2"

      volumes:
        - name: mc-data
          hostPath:
            path: /mnt/sata-storage/minecraft-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-svc
  namespace: games
spec:
  type: ClusterIP
  ports:
    - port: 25565
      targetPort: 25565
      name: mc-port
  selector:
    app: minecraft