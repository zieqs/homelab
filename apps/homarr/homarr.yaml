apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-data-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: homelab
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:1.72.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 7575
              name: http
          env:
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secret
                  key: SECRET_ENCRYPTION_KEY
          volumeMounts:
            - name: homarr-storage
              mountPath: /appdata
      volumes:
        - name: homarr-storage
          persistentVolumeClaim:
            claimName: homarr-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: homarr-web-svc
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 7575
      targetPort: 7575
  selector:
    app: homarr