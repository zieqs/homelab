apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: homelab
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          ports:
            - containerPort: 7878
              name: webui
          volumeMounts:
            - name: app-config
              mountPath: /config
              subPath: radarr
            - name: download-pool
              mountPath: /downloads
            - name: movie-library
              mountPath: /media/movies
      volumes:
        - name: app-config
          hostPath:
            path: /mnt/HDD2/media-stack
            type: Directory
        - name: download-pool
          hostPath:
            path: /mnt/HDD2/media-stack/downloads
            type: DirectoryOrCreate
        - name: movie-library
          hostPath:
            path: /mnt/HDD2/jellyfin/movies
            type: Directory
---
