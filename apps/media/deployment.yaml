apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: homelab-worker1
      securityContext:
        supplementalGroups: [44, 104]
      initContainers:
        - name: fix-permissions
          image: busybox:1.38.0
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
          securityContext:
            runAsUser: 0
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1
          env:
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          ports:
            - containerPort: 8096
              name: http
          readinessProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-media
              mountPath: /media
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: jellyfin-config
          hostPath:
            path: /mnt/sata-storage/HDD2-share/jellyfin
            type: DirectoryOrCreate
        - name: jellyfin-media
          hostPath:
            path: /mnt/sata-storage/HDD2-share/jellyfin
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: homelab
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.4.4
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kuala_Lumpur"
          ports:
            - containerPort: 7878
              name: webui
          volumeMounts:
            - name: app-config
              mountPath: /config
              subPath: radarr
            - name: download-pool
              mountPath: /downloads
            - name: movie-library
              mountPath: /media/movies
      volumes:
        - name: app-config
          hostPath:
            path: /mnt/HDD2/media-stack
            type: Directory
        - name: download-pool
          hostPath:
            path: /mnt/HDD2/media-stack/downloads
            type: DirectoryOrCreate
        - name: movie-library
          hostPath:
            path: /mnt/HDD2/jellyfin/movies
            type: Directory
---
