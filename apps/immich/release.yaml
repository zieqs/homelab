apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  releaseName: immich
  chart:
    spec:
      chart: immich
      version: ">= 0.1.0"
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system
  interval: 10m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
  values:
    image:
      tag: "v1.120.2"

    immich:
      metrics:
        enabled: false
      persistence:
        library:
          existingClaim: immich-library-pvc
      configurationKind: ConfigMap
      configuration: {}

    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgres
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: postgres-password

    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          size: 1Gi
          storageClass: local-path

    server:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
      ingress:
        main:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web
          hosts:
            - host: immich.zieqs.online
              paths:
                - path: /
                  pathType: Prefix

    microservices:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi

    machine-learning:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi

    nodeSelector:
      kubernetes.io/hostname: homelab
