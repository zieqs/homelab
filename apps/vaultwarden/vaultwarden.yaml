apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data-pvc
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 10m
  chart:
    spec:
      chart: vaultwarden
      version: "^6.0.0" 
      sourceRef:
        kind: HelmRepository
        name: johanneskastl
        namespace: flux-system
  values:
    image:
      repository: dani-garcia/vaultwarden
      tag: "1.37.0"
      pullPolicy: IfNotPresent
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    persistence:
      data:
        enabled: true
        existingClaim: "vaultwarden-data-pvc"
        mountPath: "/config"
    ingress:
      main: # Added this key to satisfy the k8s-at-home library requirements
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - host: vaultwarden.zieqs.online 
            paths:
              - path: /
                pathType: ImplementationSpecific