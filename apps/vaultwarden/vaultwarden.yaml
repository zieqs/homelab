apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data-pvc
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 10m
  chart:
    spec:
      chart: vaultwarden
      version: "^6.0.0" 
      sourceRef:
        kind: HelmRepository
        name: johanneskastl
        namespace: flux-system
  values:
    controller:
      replicas: 1

    automountServiceAccountToken: false

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    persistence:
      data:
        enabled: true
        existingClaim: "vaultwarden-data-pvc"
        mountPath: "/config"
      tmp:
        enabled: true
        type: emptyDir
        mountPath: /tmp
        medium: Memory

    ingress:
      main:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - host: vaultwarden.zieqs.online 
            paths:
              - path: /
                pathType: ImplementationSpecific