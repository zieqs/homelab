apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 3 * * 0"
  jobTemplate:
    spec:
      template:
        spec:
          nodeName: homelab
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache restic sqlite >/dev/null 2>&1

                  export RESTIC_REPOSITORY=/backup

                  if ! restic snapshots 2>/dev/null; then
                    echo "Initializing restic repository..."
                    restic init
                  fi

                  mkdir -p /tmp/vw-backup

                  echo "Backing up SQLite database..."
                  sqlite3 /data/db.sqlite3 ".backup /tmp/vw-backup/db.sqlite3"

                  echo "Copying config..."
                  cp /data/config.json /tmp/vw-backup/

                  echo "Running restic backup..."
                  restic backup \
                    /tmp/vw-backup/db.sqlite3 \
                    /tmp/vw-backup/config.json \
                    /data/attachments \
                    /data/sends \
                    /data/rsa_key* \
                    --hostname vaultwarden

                  echo "Pruning old snapshots..."
                  restic forget --keep-weekly 4 --prune

                  echo "Backup complete!"
              env:
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-backup-secret
                      key: restic-password
              volumeMounts:
                - name: vaultwarden-data
                  mountPath: /data
                  readOnly: true
                - name: backup-data
                  mountPath: /backup
          volumes:
            - name: vaultwarden-data
              persistentVolumeClaim:
                claimName: vaultwarden-data-pvc
                readOnly: true
            - name: backup-data
              hostPath:
                path: /mnt/HDD2/File-Angah/Vaultwarden-Backup
                type: DirectoryOrCreate
