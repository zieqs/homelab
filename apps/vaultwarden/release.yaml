apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 10m
  chart:
    spec:
      chart: vaultwarden
      version: "^6.0.0"
      sourceRef:
        kind: HelmRepository
        name: johanneskastl
        namespace: flux-system
  values:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    persistence:
      data:
        enabled: true
        existingClaim: "vaultwarden-data-pvc"
        mountPath: "/config"
    ingress:
      main:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - host: vaultwarden.zieqs.online
            paths:
              - path: /
                pathType: ImplementationSpecific
