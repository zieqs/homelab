apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
  namespace: obsidian
data:
  20-cors.ini: |
    [chttpd]
    enable_cors = true

    [cors]
    credentials = true
    origins = app://obsidian.md, capacitor://localhost, http://localhost
    headers = accept, authorization, content-type, origin, referer
    methods = GET, PUT, POST, HEAD, DELETE
    max_age = 3600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: obsidian
  labels:
    app: couchdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      automountServiceAccountToken: false
      initContainers:
        # The CouchDB entrypoint chowns everything under /opt/couchdb that is not
        # already owned by couchdb:couchdb, and runs under `set -e`. A ConfigMap
        # mount is read-only, so that chown fails and the pod exits 1 before
        # CouchDB ever starts. Stage the file on a writable emptyDir instead.
        - name: cors-config
          image: couchdb:3.5.3
          command:
            - sh
            - -c
            - install -o 5984 -g 5984 -m 0644 /src/20-cors.ini /dst/20-cors.ini
          volumeMounts:
            - name: couchdb-config
              mountPath: /src
              readOnly: true
            - name: couchdb-local-d
              mountPath: /dst
      containers:
        - name: couchdb
          image: couchdb:3.5.3
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: COUCHDB_PASSWORD
          ports:
            - containerPort: 5984
              name: couchdb-port
          volumeMounts:
            - name: couchdb-storage
              mountPath: /opt/couchdb/data
            - name: couchdb-local-d
              mountPath: /opt/couchdb/etc/local.d/20-cors.ini
              subPath: 20-cors.ini
      volumes:
        - name: couchdb-storage
          persistentVolumeClaim:
            claimName: couchdb-data-pvc
        - name: couchdb-config
          configMap:
            name: couchdb-config
        - name: couchdb-local-d
          emptyDir: {}
