apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden-root
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./apps/vaultwarden
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  
  decryption:
    provider: sops
    secretRef:
      name: sops-age