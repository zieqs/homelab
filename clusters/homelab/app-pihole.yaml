apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole-root
  namespace: flux-system
spec:
  interval: 60s
  path: ./apps/pihole
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  
  decryption:
    provider: sops
    secretRef:
      name: sops-age